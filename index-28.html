<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1EBE1">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="atlas-192.png">
<link rel="apple-touch-icon" href="atlas-192.png">
<title>Trip Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout (same as Wildlife Journal): a cream page inside a double gold frame, centred logo and title, a diamond divider, a photo grid, and a black bottom bar with the four actions. */
:root{
  --bg:#F1EBE1; --paper:#FAF7F2; --ink:#1F1C18; --muted:#6B6256; --gold:#A98C55; --line:#E2D8C6; --tint:#EFE7DA;
  --btn:#1F1C18; --on-btn:#FAF7F2; --scrim:rgba(31,28,24,.5); --danger:#9C3A2B;
  --sans:'Lato','Avenir Next','Segoe UI',sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --icon:url("atlas-192.png");
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45;
  padding-block:12px 96px;
  padding-left:max(10px, env(safe-area-inset-left,0px));
  padding-right:max(10px, env(safe-area-inset-right,0px));
}
button,input{font:inherit; color:inherit; border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.label{font-family:var(--sans); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700}

/* framed page */
.app{
  position:relative; max-width:640px; margin:0 auto; background:var(--paper); border:1px solid var(--gold);
  padding:34px 24px 30px; display:flex; flex-direction:column; gap:22px;
}
.app::before{content:""; position:absolute; inset:6px; border:1px solid var(--gold); pointer-events:none}

/* header */
.top{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.logo{
  width:92px; height:92px; border-radius:50%; background:var(--icon) center/cover no-repeat, #FBF2E9;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 4px var(--gold); margin:4px 0 6px;
}
h1{font-family:var(--sans); font-weight:700; font-size:14px; line-height:1.2; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin:0; text-wrap:balance}
.counts{font-family:var(--serif); font-style:normal; font-weight:400; color:var(--ink); margin:0; font-size:44px; line-height:1.1; font-variant-numeric:tabular-nums}
.subcounts{font-family:var(--serif); font-style:italic; color:var(--muted); margin:0; font-size:20px}
.divider{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:300px; color:var(--gold)}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--gold)}
.divider i{display:block; width:9px; height:9px; background:var(--gold); transform:rotate(45deg)}
.heading{font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0}
.section{display:flex; flex-direction:column; align-items:center; gap:12px}

/* notice */
.notice{border:1px solid var(--line); background:var(--tint); padding:12px 14px; font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px}
.notice b{color:var(--ink); font-weight:600; font-style:normal}

/* tools */
.tools{display:flex; flex-direction:column; gap:12px}
.search{width:100%; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; min-height:48px; font-size:16px}
.search::placeholder{color:var(--muted); font-family:var(--serif); font-style:italic}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.chip{flex:none; border:1px solid var(--ink); background:transparent; padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; min-height:38px}
.chip[aria-pressed="true"]{background:var(--btn); border-color:var(--btn); color:var(--on-btn)}

/* buttons */
.btn{
  font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--ink); background:transparent; color:var(--ink); padding:14px 18px; min-height:48px; text-align:center;
}
.btn.solid{background:var(--btn); color:var(--on-btn)}
.btn.quiet{border-color:var(--line); color:var(--muted)}
.btn.danger{border-color:var(--danger); color:var(--danger)}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 14px}
.card{background:none; border:0; padding:0; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.ph{
  position:relative; aspect-ratio:4/5; width:100%; max-width:100%; overflow:hidden;
  background:var(--icon) center/58% no-repeat, #FBF2E9; box-shadow:inset 0 0 0 1px var(--line);
}
.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.tag{position:absolute; left:8px; top:8px; background:var(--paper); color:var(--ink); padding:2px 9px}
.cname{font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; line-height:1.3; overflow-wrap:anywhere; margin-top:4px}
.sci{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px; line-height:1.25; overflow-wrap:anywhere}
.meta{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; line-height:1.35}
.more{align-self:center}
.empty{color:var(--muted); padding:28px 0; text-align:center; font-family:var(--serif); font-style:italic}

/* species list */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:14px; padding:14px 0; border:0; border-bottom:1px solid var(--line); width:100%; background:none; text-align:left}
.row .grow{flex:1; min-width:0}
.row .n{font-weight:700; font-size:22px; font-variant-numeric:tabular-nums; color:var(--gold)}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--btn); color:var(--on-btn);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
.navb{flex:1; min-width:0; background:none; border:0; border-bottom:3px solid transparent; color:inherit; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; padding:20px 4px 17px; opacity:.8}
.navb[aria-pressed="true"]{opacity:1; border-bottom-color:var(--gold)}

/* sheet */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.panel{
  background:var(--paper); border-top:2px solid var(--gold); width:100%; max-width:560px; max-height:92%; overflow-y:auto;
  padding-top:22px; padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(22px, env(safe-area-inset-left,0px)); padding-right:max(22px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:16px;
}
@media (min-width:640px){ .overlay{align-items:center} .panel{max-height:88%; border:1px solid var(--gold)} }
.panel .ph{aspect-ratio:4/3; background-size:34%}
.panel h2{font-family:var(--sans); font-size:18px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; line-height:1.3; margin:0; text-wrap:balance}
.panel .sci{font-size:18px}
.panel dl{margin:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:14px 0}
.panel dt{font-family:var(--serif); font-style:italic; font-size:18px; letter-spacing:0; text-transform:none; font-weight:400; color:var(--muted); text-align:right; padding-right:18px}
.panel dd{margin:0; min-width:0; overflow-wrap:anywhere; border-left:1px solid var(--gold); padding-left:18px}
.panel .btnrow{display:flex; gap:8px; flex-wrap:wrap}
.panel .btnrow .btn{flex:1 1 140px}
.panel a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; align-self:center; padding:0 6px}
.field{display:flex; flex-direction:column; gap:6px}
.field input{border:1px solid var(--gold); background:var(--paper); padding:11px 12px; min-height:48px; width:100%}
.note{color:var(--muted); font-family:var(--serif); font-style:italic; margin:0}
input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
@media (prefers-reduced-motion:no-preference){ .card:hover .ph{filter:brightness(1.04)} }
/* detail sheet headings */
.sec{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px}
.sec .gold{color:var(--gold); letter-spacing:.3em}
.sec .div{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:260px}
.sec .div::before,.sec .div::after{content:""; flex:1; height:1px; background:var(--gold)}
.sec .div i{display:block; width:8px; height:8px; background:var(--gold); transform:rotate(45deg)}
.pill{display:inline-block; border:1px solid var(--gold); padding:2px 10px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
/* species gallery */
.gal{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px}
.gitem{display:flex; flex-direction:column; gap:6px; min-width:0}
.gitem .ph{aspect-ratio:1/1}
.gact{display:flex; flex-direction:column; gap:6px}
.btn.sm{min-height:40px; padding:10px 12px}
.panel .list{margin:0}
/* zoom and crop */
.ph.zoomable{cursor:zoom-in}
.gitem .ph{aspect-ratio:4/5}
.panel > .ph{aspect-ratio:4/5; width:min(100%,320px); align-self:center; background-size:40%}
.gact{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.gact.stack{grid-template-columns:1fr}
.gact .btn{padding:10px 4px; letter-spacing:.1em}
.cropframe{position:relative; aspect-ratio:4/5; width:min(100%,320px); align-self:center; overflow:hidden; background:#FBF2E9; box-shadow:inset 0 0 0 1px var(--gold); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.cropframe.grab{cursor:grabbing}
.cropframe img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; display:block}
.field input[type=range]{padding:0; min-height:36px; border:0; background:none; accent-color:var(--gold)}
.lb{position:fixed; inset:0; z-index:30; background:rgba(8,7,6,.96); display:flex; flex-direction:column}
.lbscroll{flex:1; min-height:0; overflow:auto; display:flex; padding:12px; -webkit-overflow-scrolling:touch}
.lbscroll img{margin:auto; max-width:100%; max-height:100%; object-fit:contain; cursor:zoom-in; display:block}
.lb.zoomed .lbscroll img{max-width:none; max-height:none; width:260%; cursor:zoom-out}
.lbbar{display:flex; gap:8px; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.lbbar .btn{flex:1; border-color:#F3EADF; color:#F3EADF}
.lbbar .btn.solid{background:#F3EADF; color:#1A1815}
/* index + species gallery page */
.back{display:inline-block; align-self:flex-start; color:var(--ink); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:5px; padding:12px 0; min-height:44px}
.gallery{display:flex; flex-direction:column; gap:16px}
.gallery .btnrow{display:flex; gap:8px; flex-wrap:wrap}
.gallery .btnrow .btn{flex:1 1 140px}
.gtitle{font-family:var(--sans); font-size:20px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; line-height:1.3; margin:0 0 4px; text-wrap:balance}
.row .chev{color:var(--gold); font-size:24px; line-height:1}
.row:hover .cname{text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px}
/* letters, counts, notes, viewer arrows */
.letter{list-style:none; font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.3em; color:var(--gold); padding:20px 0 6px; border-bottom:1px solid var(--gold)}
.letter:first-child{padding-top:0}
.row .cnt{white-space:nowrap; font-size:12px; letter-spacing:.04em}
.row .cnt.none{opacity:.7; font-style:italic}
textarea.notes{width:100%; min-height:120px; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; font-family:var(--serif); font-size:16px; line-height:1.5; resize:vertical; color:var(--ink); border-radius:0}
textarea.notes::placeholder{color:var(--muted); font-style:italic}
.lbcount{position:absolute; top:max(14px,env(safe-area-inset-top,0px)); left:0; right:0; text-align:center; color:#F3EADF; font-size:13px; letter-spacing:.16em; pointer-events:none; text-shadow:0 1px 3px #000}
.lbbar .btn.nav{flex:0 0 52px; padding-left:0; padding-right:0; font-size:22px; letter-spacing:0; line-height:1}
/* reference look: light, airy rows */
.list .row{padding:20px 0}
.list .cname{font-size:20px; font-weight:400; letter-spacing:0; text-transform:none; margin-top:0; line-height:1.25}
.list .sci{font-size:16px; margin-top:2px}
.row .cnt{background:var(--gold); color:#FAF7F2; border-radius:999px; padding:3px 11px; font-weight:700; font-size:12px; letter-spacing:.06em}
.row .cnt.none{background:none; color:var(--muted); font-weight:400; opacity:1; padding:0}
.letter{margin-top:6px}
/* Travel additions */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 14px}
textarea.notes{min-height:160px}
.field textarea.notes{min-height:90px}
.field select{border:1px solid var(--gold); background:var(--paper); padding:11px 12px; min-height:48px; width:100%}
.panel .btnrow.center{justify-content:center}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo" role="img" aria-label="Travel logo"></div>
    <h1>Travel</h1>
    <p class="counts" id="counts"></p>
    <p class="subcounts" id="subcounts"></p>
    <div class="divider" aria-hidden="true"><i></i></div>
  </header>

  <div class="notice" id="notice" role="status" hidden></div>

  <div class="tools" id="tools">
    <input class="search" id="q" type="search" placeholder="Search a country or a city" aria-label="Search">
  </div>

  <main id="view"></main>
</div>

<nav class="bar" aria-label="Main">
  <button class="navb" id="tab-index" type="button" aria-pressed="true">Index</button>
  <button class="navb" id="add" type="button">Add</button>
</nav>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <div class="lbcount" id="lbcount" aria-live="polite"></div>
  <div class="lbscroll" id="lbscroll"><img id="lbimg" alt=""></div>
  <div class="lbbar">
    <button class="btn nav" id="lbprev" type="button" aria-label="Previous picture" hidden>&#8249;</button>
    <button class="btn" id="lbzoom" type="button">Zoom</button>
    <button class="btn" id="lbcrop" type="button">Crop</button>
    <button class="btn nav" id="lbnext" type="button" aria-label="Next picture" hidden>&#8250;</button>
    <button class="btn solid" id="lbclose" type="button">Close</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Details"></div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var countries=[], cities=[], isSample=false, photoCache={}, ready=false;
  var state={q:'',c:null,t:null};

  /* sample entries, shown until the first real one is added */
  var SAMPLE_C=[{id:'s-it',name:'Italy',sample:true},{id:'s-jp',name:'Japan',sample:true},{id:'s-pt',name:'Portugal',sample:true}];
  var SAMPLE_T=[
    {id:'s-rome',cid:'s-it',name:'Rome',desc:'Ancient ruins, fountains on every corner and long lunches. Easy to cover on foot.',photos:[],sample:true},
    {id:'s-flo',cid:'s-it',name:'Florence',desc:'Renaissance art, the Duomo skyline and sunset over the Arno.',photos:[],sample:true},
    {id:'s-kyo',cid:'s-jp',name:'Kyoto',desc:'Temples, tea houses and quiet lanes in the old town.',photos:[],sample:true},
    {id:'s-lis',cid:'s-pt',name:'Lisbon',desc:'Hills, yellow trams and pastries at every turn.',photos:[],sample:true}
  ];

  /* storage: IndexedDB with an in-memory fallback */
  var memory={}, dbp=null;
  function db(){
    if(!dbp) dbp=new Promise(function(res){
      try{
        var r=indexedDB.open('travel-journal',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){res(null)};
      }catch(e){res(null)}
    });
    return dbp;
  }
  function get(k){
    return db().then(function(d){
      if(!d) return memory[k];
      return new Promise(function(res){
        try{var q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){res(q.result)}; q.onerror=function(){res(undefined)}}
        catch(e){res(memory[k])}
      });
    });
  }
  function put(k,v){
    memory[k]=v;
    return db().then(function(d){
      if(!d) return;
      return new Promise(function(res){
        try{var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; t.onabort=res}
        catch(e){res()}
      });
    });
  }
  function drop(k){
    delete memory[k];
    return db().then(function(d){
      if(!d) return;
      return new Promise(function(res){
        try{var t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=res; t.onabort=res}
        catch(e){res()}
      });
    });
  }
  function saveData(){ return put('countries',countries).then(function(){ return put('cities',cities); }); }
  function getPhoto(id){
    if(photoCache[id]!==undefined) return Promise.resolve(photoCache[id]);
    return get('photo:'+id).then(function(v){photoCache[id]=v||null; return photoCache[id]});
  }

  /* small DOM helper (text only, never HTML) */
  function h(tag,attrs){
    var el=document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k==='class') el.className=attrs[k]; else if(k==='on') Object.keys(attrs.on).forEach(function(e){el.addEventListener(e,attrs.on[e])});
      else el.setAttribute(k,attrs[k]);
    });
    for(var i=2;i<arguments.length;i++){
      var c=arguments[i]; if(c==null||c===false) continue;
      el.appendChild(typeof c==='string'?document.createTextNode(c):c);
    }
    return el;
  }
  function sec(t){ return h('div',{class:'sec'},h('span',{class:'label gold'},t),h('div',{class:'div'},h('i'))); }
  function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function today(){var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(d){
    if(!d) return '';
    var p=d.split('-'); if(p.length<3) return d;
    var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return isNaN(dt)?d:dt.toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'});
  }
  function plural(n,a,b){ return n+' '+(n===1?a:b); }
  function byName(a,b){ return a.name.localeCompare(b.name,'en',{sensitivity:'base'}); }
  function countryOf(id){ return countries.filter(function(c){return c.id===id})[0]; }
  function cityOf(id){ return cities.filter(function(c){return c.id===id})[0]; }
  function cityList(cid){ return cities.filter(function(x){return x.cid===cid}).sort(byName); }
  function coverOf(t){
    var ps=t.photos||[]; if(!ps.length) return null;
    for(var i=0;i<ps.length;i++) if(ps[i].id===t.cover) return ps[i];
    return ps[0];
  }
  function letterOf(nm){
    var L=(nm||'').charAt(0).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    return /[A-Z]/.test(L)?L:'#';
  }

  /* picture box: your photo, otherwise the logo placeholder */
  function cropCss(c){ return 'translate('+(c.px*100)+'%,'+(c.py*100)+'%) scale('+c.z+')'; }
  function pic(p,onzoom,sample){
    var box=h('div',{class:'ph'});
    if(onzoom){
      box.className='ph zoomable'; box.setAttribute('role','button'); box.setAttribute('tabindex','0'); box.setAttribute('aria-label','Zoom picture');
      box.addEventListener('click',onzoom);
      box.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onzoom(); } });
    }
    if(p) getPhoto(p.id).then(function(src){
      if(!src) return;
      var im=new Image(); im.alt='';
      im.onload=function(){ if(p.crop) im.style.transform=cropCss(p.crop); box.appendChild(im); };
      im.src=src;
    });
    if(sample) box.appendChild(h('span',{class:'tag label'},'Sample'));
    return box;
  }

  /* routing: #c/<country> and #c/<country>/<city> */
  function go(hash){ if(location.hash===hash) route(); else location.hash=hash; }
  function route(keep){
    var m=/^#c\/([^\/]+)(?:\/([^\/]+))?$/.exec(location.hash);
    state.c=m?decodeURIComponent(m[1]):null; state.t=(m&&m[2])?decodeURIComponent(m[2]):null;
    render(); if(!keep) window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',function(){route(false)});
  function say(msg){ var nb=$('#notice'); nb.dataset.msg='1'; nb.hidden=false; nb.textContent=msg; }

  /* views */
  function renderCounts(){
    $('#counts').textContent=plural(countries.length,'country','countries');
    $('#subcounts').textContent=plural(cities.length,'city','cities');
  }
  function renderIndex(v){
    var q=state.q.trim().toLowerCase();
    var rows=countries.map(function(c){
      var cs=cityList(c.id);
      return {c:c,cs:cs,hit:q?cs.filter(function(x){return x.name.toLowerCase().indexOf(q)>-1}):[]};
    }).filter(function(r){ return !q||r.c.name.toLowerCase().indexOf(q)>-1||r.hit.length; })
      .sort(function(a,b){return byName(a.c,b.c)});
    if(!rows.length){ v.appendChild(h('p',{class:'empty'},countries.length?'Nothing matches this search.':'No countries yet. Tap Add to start.')); return; }
    var ul=h('ul',{class:'list'}), last='';
    rows.forEach(function(r){
      var L=letterOf(r.c.name);
      if(L!==last){ last=L; ul.appendChild(h('li',{class:'letter','aria-hidden':'true'},L)); }
      var nameHit=!q||r.c.name.toLowerCase().indexOf(q)>-1;
      var n=r.cs.length;
      ul.appendChild(h('li',null,h('button',{class:'row',type:'button',on:{click:function(){go('#c/'+encodeURIComponent(r.c.id))}}},
        h('span',{class:'grow'},
          h('span',{class:'cname',style:'display:block'},r.c.name),
          (!nameHit&&r.hit.length)?h('span',{class:'sci',style:'display:block'},r.hit.map(function(x){return x.name}).join(', ')):null),
        h('span',{class:'meta cnt'+(n?'':' none')},n?plural(n,'city','cities'):'No cities'),
        h('span',{class:'chev','aria-hidden':'true'},'\u203a'))));
    });
    v.appendChild(ul);
  }

  /* inline "are you sure" for deletes */
  function confirmRow(label,yesLabel,onYes){
    var row=h('div',{class:'btnrow'});
    function first(){
      row.textContent='';
      row.appendChild(h('button',{class:'btn danger',type:'button',on:{click:function(){
        row.textContent='';
        row.appendChild(h('button',{class:'btn danger',type:'button',on:{click:onYes}},yesLabel));
        row.appendChild(h('button',{class:'btn quiet',type:'button',on:{click:first}},'Keep it'));
      }}},label));
    }
    first(); return row;
  }

  function renderCountry(v,c){
    var cs=cityList(c.id), np=0; cs.forEach(function(t){np+=(t.photos||[]).length});
    var g=h('div',{class:'gallery'});
    g.appendChild(h('a',{class:'back',href:'#'},'\u2190 All countries'));
    g.appendChild(h('div',null,h('h2',{class:'gtitle'},c.name)));
    g.appendChild(h('p',{class:'note'},plural(cs.length,'city','cities')+' \u00b7 '+plural(np,'photo','photos')));
    if(c.sample){
      g.appendChild(h('p',{class:'note'},'This is a sample entry. It disappears when you add your first country.'));
    } else {
      g.appendChild(h('div',{class:'btnrow'},
        h('button',{class:'btn solid',type:'button',on:{click:function(){openAdd({country:c.name})}}},'Add city'),
        h('button',{class:'btn',type:'button',on:{click:function(){
          openRename('Rename country',c.name,function(val){ c.name=val; return saveData(); });
        }}},'Rename')));
    }
    g.appendChild(sec('Cities'));
    if(!cs.length) g.appendChild(h('p',{class:'note'},'No cities yet. Tap Add city.'));
    var grid=h('div',{class:'cards'});
    cs.forEach(function(t){
      var n=(t.photos||[]).length;
      grid.appendChild(h('button',{class:'card',type:'button',on:{click:function(){go('#c/'+encodeURIComponent(c.id)+'/'+encodeURIComponent(t.id))}}},
        pic(coverOf(t),null,t.sample),
        h('span',{class:'cname'},t.name),
        h('span',{class:'meta'},n?plural(n,'photo','photos'):'No photos')));
    });
    g.appendChild(grid);
    if(!c.sample){
      g.appendChild(confirmRow('Delete country','Yes, delete '+c.name+' and its cities',function(){
        var jobs=[]; cs.forEach(function(t){ (t.photos||[]).forEach(function(p){ jobs.push(drop('photo:'+p.id)); photoCache[p.id]=null; }); });
        cities=cities.filter(function(t){return t.cid!==c.id});
        countries=countries.filter(function(x){return x.id!==c.id});
        Promise.all(jobs).then(saveData).then(function(){ go('#'); });
      }));
    }
    g.appendChild(h('a',{class:'back',href:'#'},'\u2190 All countries'));
    v.appendChild(g);
  }

  function renderCity(v,c,t){
    var pics=t.photos||[];
    var targets=pics.map(function(p){return {t:t,p:p}});
    var backHref='#c/'+encodeURIComponent(c.id);
    function again(){ closeSheet(); render(); }
    var g=h('div',{class:'gallery'});
    g.appendChild(h('a',{class:'back',href:backHref},'\u2190 '+c.name));
    g.appendChild(h('div',null,h('h2',{class:'gtitle'},t.name),h('div',{class:'sci'},c.name)));
    g.appendChild(h('p',{class:'note'},plural(pics.length,'photo','photos')));
    if(t.sample){
      g.appendChild(h('p',{class:'note'},'This is a sample entry. It disappears when you add your first country.'));
    } else {
      g.appendChild(h('div',{class:'btnrow'},
        h('button',{class:'btn solid',type:'button',on:{click:function(){
          pickPhotos(function(list){
            var base=Date.now();
            list.reduce(function(pr,data,i){
              var id='p-'+base+'-'+i;
              return pr.then(function(){return put('photo:'+id,data)}).then(function(){ photoCache[id]=data; t.photos=t.photos||[]; t.photos.push({id:id,date:today()}); });
            },Promise.resolve()).then(saveData).then(function(){render()});
          });
        }}},'Add photos'),
        h('button',{class:'btn',type:'button',on:{click:function(){
          openRename('Rename city',t.name,function(val){ t.name=val; return saveData(); });
        }}},'Rename')));
    }

    g.appendChild(sec('About this place'));
    if(t.sample){
      g.appendChild(h('p',{class:'note'},t.desc||''));
    } else {
      var ta=h('textarea',{class:'notes',rows:'6','aria-label':'Description of '+t.name,placeholder:'What it was like, where you stayed, what to eat\u2026'});
      ta.value=t.desc||'';
      var st=h('p',{class:'note'},''), tmr=null;
      var saveDesc=function(){ t.desc=ta.value; saveData().then(function(){ st.textContent='Saved'; }); };
      ta.addEventListener('input',function(){ st.textContent=''; clearTimeout(tmr); tmr=setTimeout(function(){tmr=null;saveDesc();},500); });
      ta.addEventListener('blur',function(){ if(tmr){ clearTimeout(tmr); tmr=null; saveDesc(); } });
      g.appendChild(ta); g.appendChild(st);
    }

    g.appendChild(sec('Photos'));
    if(!pics.length) g.appendChild(h('p',{class:'note'},t.sample?'Photos you add will show here.':'No photos yet. Tap Add photos.'));
    var gal=h('div',{class:'gal'});
    pics.forEach(function(p,i){
      var target=targets[i], act=h('div',{class:'gact'});
      function ask(){
        act.textContent=''; act.className='gact';
        act.appendChild(h('button',{class:'btn quiet sm',type:'button',on:{click:function(){ cropPicture(target,again); }}},'Crop'));
        var rm=h('button',{class:'btn quiet sm',type:'button'},'Remove');
        rm.addEventListener('click',function(){
          act.textContent=''; act.className='gact stack';
          act.appendChild(h('button',{class:'btn danger sm',type:'button',on:{click:function(){ removePhoto(t,p); }}},'Yes, remove'));
          act.appendChild(h('button',{class:'btn quiet sm',type:'button',on:{click:ask}},'Keep'));
        });
        act.appendChild(rm);
      }
      ask();
      var isCover=(coverOf(t)||{}).id===p.id;
      var coverBtn=h('button',{class:'btn sm'+(isCover?' solid':''),type:'button',on:{click:function(){
        if(isCover) return; t.cover=p.id; saveData().then(function(){render()});
      }}},isCover?'Cover photo':'Use as cover');
      if(isCover) coverBtn.setAttribute('aria-pressed','true');
      gal.appendChild(h('div',{class:'gitem'},
        pic(p,function(){ openLightbox(target,again,targets,i); }),
        h('span',{class:'meta'},fmt(p.date)),
        coverBtn,act));
    });
    g.appendChild(gal);

    if(!t.sample){
      g.appendChild(confirmRow('Delete city','Yes, delete '+t.name,function(){
        var jobs=(t.photos||[]).map(function(p){ photoCache[p.id]=null; return drop('photo:'+p.id); });
        cities=cities.filter(function(x){return x.id!==t.id});
        Promise.all(jobs).then(saveData).then(function(){ go(backHref); });
      }));
    }
    g.appendChild(h('a',{class:'back',href:backHref},'\u2190 '+c.name));
    v.appendChild(g);
  }

  function removePhoto(t,p){
    t.photos=(t.photos||[]).filter(function(x){return x.id!==p.id});
    if(t.cover===p.id) delete t.cover;
    photoCache[p.id]=null;
    drop('photo:'+p.id).then(saveData).then(function(){render()});
  }

  function render(){
    renderCounts();
    var c=state.c?countryOf(state.c):null, t=(c&&state.t)?cityOf(state.t):null;
    if((state.c&&!c)||(state.t&&(!t||t.cid!==c.id))){
      if(!ready) return;
      state.c=state.t=null; c=t=null; if(location.hash) history.replaceState(null,'',location.pathname+location.search);
    }
    var v=$('#view'); v.textContent='';
    $('#tools').hidden=!!c;
    $('#tab-index').setAttribute('aria-pressed',String(!c));
    if(t) renderCity(v,c,t); else if(c) renderCountry(v,c); else renderIndex(v);
    var nb=$('#notice');
    if(isSample && !nb.dataset.msg){ nb.hidden=false; nb.textContent=''; nb.appendChild(h('span',null,h('b',null,'Sample entries. '),'These show how the index looks. Tap Add to start your own list; the samples disappear.')); }
  }

  /* sheet */
  function closeSheet(){ $('#overlay').hidden=true; $('#panel').textContent=''; }
  function openSheet(){ $('#overlay').hidden=false; var f=$('#panel').querySelector('input,button'); if(f) f.focus(); }
  $('#overlay').addEventListener('click',function(e){ if(e.target===this) closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; if(!$('#lb').hidden) closeLb(); else if(!$('#overlay').hidden) closeSheet(); });

  /* photos: shrink big phone pictures before keeping them */
  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var m=1400, s=Math.min(1,m/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82));
      };
      im.onerror=function(){URL.revokeObjectURL(url); rej(new Error('image'))};
      im.src=url;
    });
  }
  function pickPhotos(cb){
    var inp=h('input',{type:'file',accept:'image/*',multiple:'multiple','aria-label':'Choose photos'});
    document.body.appendChild(inp);
    inp.addEventListener('change',function(){
      var fs=Array.prototype.slice.call(inp.files||[]); document.body.removeChild(inp);
      if(!fs.length) return;
      var out=[], bad=0;
      fs.reduce(function(p,f){ return p.then(function(){ return shrink(f).then(function(d){out.push(d)},function(){bad++}); }); },Promise.resolve())
        .then(function(){ if(bad) say(bad+(bad===1?' file':' files')+' could not be read as a photo.'); if(out.length) cb(out); });
    });
    inp.click();
  }

  /* zoom (lightbox) */
  var lbState={target:null,back:null,list:[],idx:0};
  function closeLb(){ $('#lb').hidden=true; $('#lb').classList.remove('zoomed'); $('#lbimg').removeAttribute('src'); }
  function toggleZoom(){
    var lb=$('#lb'), sc=$('#lbscroll'); lb.classList.toggle('zoomed');
    if(lb.classList.contains('zoomed')){ setTimeout(function(){ sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2; sc.scrollTop=(sc.scrollHeight-sc.clientHeight)/2; },30); }
    else { sc.scrollLeft=0; sc.scrollTop=0; }
  }
  function showLb(i){
    var L=lbState.list; if(!L.length) return;
    i=(i+L.length)%L.length; lbState.idx=i; lbState.target=L[i];
    $('#lbcount').textContent=L.length>1?(i+1)+' / '+L.length:'';
    $('#lbprev').hidden=L.length<2; $('#lbnext').hidden=L.length<2;
    getPhoto(L[i].p.id).then(function(src){
      if(!src||lbState.idx!==i) return;
      $('#lb').classList.remove('zoomed'); $('#lbimg').src=src; $('#lb').hidden=false; $('#lbclose').focus();
    });
  }
  function openLightbox(t,back,list,idx){
    lbState.back=back; lbState.list=(list&&list.length)?list:[t]; showLb((list&&list.length)?(idx||0):0);
  }
  $('#lbclose').addEventListener('click',closeLb);
  $('#lbimg').addEventListener('click',toggleZoom);
  $('#lbzoom').addEventListener('click',toggleZoom);
  $('#lbprev').addEventListener('click',function(){ showLb(lbState.idx-1); });
  $('#lbnext').addEventListener('click',function(){ showLb(lbState.idx+1); });
  $('#lbcrop').addEventListener('click',function(){ var t=lbState.target, b=lbState.back; closeLb(); if(t) cropPicture(t,b); });
  (function(){
    var sx=null, sy=null, box=$('#lbscroll');
    box.addEventListener('touchstart',function(e){
      if($('#lb').classList.contains('zoomed')||e.touches.length!==1){ sx=null; return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    },{passive:true});
    box.addEventListener('touchend',function(e){
      if(sx===null) return;
      var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) showLb(lbState.idx+(dx<0?1:-1));
    },{passive:true});
    document.addEventListener('keydown',function(e){
      if($('#lb').hidden) return;
      if(e.key==='ArrowRight') showLb(lbState.idx+1); else if(e.key==='ArrowLeft') showLb(lbState.idx-1);
    });
  })();

  /* crop: drag and zoom, then keep only the visible part */
  function cropPicture(t,back){
    var p=$('#panel'); p.textContent='';
    var z=1, px=0, py=0, loaded=null;
    var frame=h('div',{class:'cropframe'}), im=new Image(); im.alt=''; im.draggable=false;
    frame.appendChild(im);
    var slider=h('input',{id:'crop-z',type:'range',min:'1',max:'4',step:'0.02',value:'1','aria-label':'Zoom'});
    var msg=h('p',{class:'note'},'Drag the picture to move it. Use the slider to zoom in. Save crop keeps only this part of the picture.');
    function limit(){ var m=(z-1)/2; px=Math.max(-m,Math.min(m,px)); py=Math.max(-m,Math.min(m,py)); }
    function apply(){ limit(); im.style.transform=cropCss({z:z,px:px,py:py}); }
    var drag=null;
    frame.addEventListener('pointerdown',function(e){ drag={x:e.clientX,y:e.clientY}; try{frame.setPointerCapture(e.pointerId)}catch(_){} frame.classList.add('grab'); });
    frame.addEventListener('pointermove',function(e){
      if(!drag) return; var r=frame.getBoundingClientRect();
      px+=(e.clientX-drag.x)/r.width; py+=(e.clientY-drag.y)/r.height; drag={x:e.clientX,y:e.clientY}; apply();
    });
    function end(){ drag=null; frame.classList.remove('grab'); }
    frame.addEventListener('pointerup',end); frame.addEventListener('pointercancel',end);
    slider.addEventListener('input',function(){ z=parseFloat(slider.value); apply(); });
    getPhoto(t.p.id).then(function(src){
      if(!src){ msg.textContent='This picture could not be loaded.'; return; }
      var img=new Image(); img.onload=function(){ loaded=img; im.src=src; apply(); }; img.onerror=function(){ msg.textContent='This picture could not be loaded.'; }; img.src=src;
    });
    function bake(){
      var W=frame.clientWidth, H=frame.clientHeight, img=loaded, w=img.naturalWidth, h2=img.naturalHeight;
      var s0=Math.max(W/w,H/h2), vw=W/(s0*z), vh=H/(s0*z);
      var cx=w/2-(px*W)/(s0*z), cy=h2/2-(py*H)/(s0*z);
      var sx=Math.max(0,Math.min(w-vw,cx-vw/2)), sy=Math.max(0,Math.min(h2-vh,cy-vh/2));
      var ow=Math.min(1400,Math.round(vw)), oh=Math.round(ow*vh/vw);
      var cv=document.createElement('canvas'); cv.width=ow; cv.height=oh;
      cv.getContext('2d').drawImage(img,sx,sy,vw,vh,0,0,ow,oh);
      return cv.toDataURL('image/jpeg',0.88);
    }
    function save(){
      if(!loaded) return;
      if(z<=1.001){ back(); return; }
      var data=null; try{ data=bake(); }catch(e){ data=null; }
      if(!data){ msg.textContent='The picture could not be cropped.'; return; }
      put('photo:'+t.p.id,data).then(function(){ photoCache[t.p.id]=data; render(); back(); });
    }
    p.appendChild(h('h2',null,'Crop picture'));
    p.appendChild(msg);
    p.appendChild(frame);
    p.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'crop-z'},'Zoom'),slider));
    p.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn solid',type:'button',on:{click:save}},'Save crop'),
      h('button',{class:'btn',type:'button',on:{click:function(){ z=1;px=0;py=0;slider.value='1';apply(); }}},'Reset'),
      h('button',{class:'btn quiet',type:'button',on:{click:function(){ back(); }}},'Cancel')));
    openSheet();
  }

  /* rename sheet */
  function openRename(title,current,apply){
    var p=$('#panel'); p.textContent='';
    var f=h('form',{style:'display:flex;flex-direction:column;gap:14px'});
    var inp=h('input',{id:'f-rename',type:'text',autocomplete:'off',value:current});
    f.appendChild(h('h2',null,title));
    f.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'f-rename'},'Name'),inp));
    f.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn solid',type:'submit'},'Save'),
      h('button',{class:'btn quiet',type:'button',on:{click:closeSheet}},'Cancel')));
    f.addEventListener('submit',function(e){
      e.preventDefault(); var val=inp.value.trim(); if(!val){ inp.focus(); return; }
      Promise.resolve(apply(val)).then(function(){ closeSheet(); render(); });
    });
    p.appendChild(f); openSheet();
  }

  /* add a country, a city, a description and photos in one go */
  function openAdd(pre){
    pre=pre||{};
    var p=$('#panel'); p.textContent='';
    var photoData=[];
    var status=h('p',{class:'note'},'No photos chosen yet.');
    var f=h('form',{style:'display:flex;flex-direction:column;gap:14px'});
    var dl=h('datalist',{id:'dl-countries'});
    countries.filter(function(c){return !c.sample}).sort(byName).forEach(function(c){ dl.appendChild(h('option',{value:c.name})); });
    var inC=h('input',{id:'f-country',type:'text',autocomplete:'off',list:'dl-countries',value:pre.country||''});
    var inT=h('input',{id:'f-city',type:'text',autocomplete:'off'});
    var ta=h('textarea',{id:'f-desc',class:'notes',rows:'3',placeholder:'Optional'});
    f.appendChild(h('h2',null,pre.country?'Add a city':'Add a place'));
    f.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'f-country'},'Country'),inC,dl));
    f.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'f-city'},'City (optional)'),inT));
    f.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'f-desc'},'Description'),ta));
    f.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn',type:'button',on:{click:function(){ pickPhotos(function(d){ photoData=photoData.concat(d); status.textContent=plural(photoData.length,'photo','photos')+' ready.'; }); }}},'Choose photos'),status));
    f.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn solid',type:'submit'},'Save'),
      h('button',{class:'btn quiet',type:'button',on:{click:closeSheet}},'Cancel')));
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var cn=inC.value.trim(), tn=inT.value.trim(), desc=ta.value.trim();
      if(!cn){ status.textContent='Enter a country first.'; inC.focus(); return; }
      if(!tn&&(photoData.length||desc)){ status.textContent='Photos and a description belong to a city. Enter a city name.'; inT.focus(); return; }
      if(isSample){ countries=[]; cities=[]; isSample=false; $('#notice').dataset.msg=''; $('#notice').hidden=true; }
      var c=countries.filter(function(x){return x.name.toLowerCase()===cn.toLowerCase()})[0];
      if(!c){ c={id:uid('c'),name:cn}; countries.push(c); }
      var t=null;
      if(tn){
        t=cities.filter(function(x){return x.cid===c.id&&x.name.toLowerCase()===tn.toLowerCase()})[0];
        if(!t){ t={id:uid('t'),cid:c.id,name:tn,desc:'',photos:[]}; cities.push(t); }
        if(desc) t.desc=t.desc?t.desc+'\n\n'+desc:desc;
      }
      var base=Date.now();
      photoData.reduce(function(pr,data,i){
        var id='p-'+base+'-'+i;
        return pr.then(function(){return put('photo:'+id,data)}).then(function(){ photoCache[id]=data; t.photos=t.photos||[]; t.photos.push({id:id,date:today()}); });
      },Promise.resolve()).then(saveData).then(function(){
        closeSheet();
        go('#c/'+encodeURIComponent(c.id)+(t?'/'+encodeURIComponent(t.id):''));
      });
    });
    p.appendChild(f); openSheet();
  }
  $('#add').addEventListener('click',function(){
    var c=state.c?countryOf(state.c):null;
    openAdd(c&&!c.sample?{country:c.name}:null);
  });

  $('#q').addEventListener('input',function(){state.q=this.value;render()});
  $('#tab-index').addEventListener('click',function(){ if(location.hash&&location.hash!=='#') location.hash=''; else { route(false); } });

  /* start with the samples, then use saved data if there is any */
  countries=SAMPLE_C.map(function(x){return Object.assign({},x)});
  cities=SAMPLE_T.map(function(x){return Object.assign({},x)});
  isSample=true; route(true);
  Promise.all([get('countries'),get('cities')]).then(function(r){
    if(Array.isArray(r[0])){ countries=r[0]; cities=Array.isArray(r[1])?r[1]:[]; isSample=false; }
    ready=true; route(true);
  });
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
